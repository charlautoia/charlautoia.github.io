<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stop the Time</title>
<meta name="description" content="Un jeu de precision : arreter le chronometre pile sur la cible.">
<style>
  :root{
    --nuit:#1B2A4A;
    --encre:#F2E8C9;
    --jaune:#F0A830;
    --corail:#E4573D;
    --vert:#7DA87B;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;
    background:var(--nuit);
    color:var(--encre);
    font-family:"Segoe UI",Roboto,system-ui,sans-serif;
    font-size:17px;
    line-height:1.6;
  }
  .wrap{max-width:40rem;margin:0 auto;padding:0 1.5rem}

  header{padding:5rem 0 3.5rem}
  .chrono{
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    font-size:clamp(3.5rem,14vw,7rem);
    font-weight:600;
    letter-spacing:-0.03em;
    color:var(--jaune);
    line-height:1;
    font-variant-numeric:tabular-nums;
    margin:0;
  }
  .chrono .cs{color:var(--corail)}
  h1{
    font-size:1.05rem;
    font-weight:600;
    margin:0 0 2.5rem;
  }
  .sous{margin:1.25rem 0 0;font-size:1.15rem;max-width:32rem}

  section{
    border-top:1px solid rgba(242,232,201,0.18);
    padding:2.5rem 0;
  }
  p{margin:0 0 1rem;max-width:34rem}
  .etat{
    display:inline-block;
    font-size:0.85rem;
    color:var(--vert);
    border:1px solid var(--vert);
    border-radius:2rem;
    padding:0.1rem 0.7rem;
  }
  a{color:var(--jaune)}
  a:focus-visible{outline:2px solid var(--jaune);outline-offset:3px}
  footer{
    border-top:1px solid rgba(242,232,201,0.18);
    padding:2rem 0 4rem;
    font-size:0.92rem;
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Stop the Time</h1>
    <p class="chrono">10<span class="cs">.00</span></p>
    <p class="sous">Lancez le chronometre, arretez-le pile sur la cible. Cinq cibles, un mode aveugle ou les chiffres disparaissent en cours de route, et vos records gardes sur l'appareil.</p>
  </header>

  <section>
    <p><span class="etat">en developpement</span></p>
  </section>

  <footer>
    <p><a href="privacy.html">Politique de confidentialite</a></p>
  </footer>
</div>

</body>
</html>
